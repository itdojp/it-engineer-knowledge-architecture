name: Sync YouTube Descriptions

on:
  pull_request:
    paths:
      - 'books/youtube/books.yaml'
      - 'docs/_data/catalog.json'
      - 'docs/_data/youtube.json'
      - 'templates/youtube/description_*.txt'
      - 'scripts/generate_descriptions.py'
      - 'scripts/update_youtube_videos.py'
      - 'tests/test_youtube_sync.py'
  push:
    branches:
      - main
    paths:
      - 'books/youtube/books.yaml'
      - 'docs/_data/catalog.json'
      - 'docs/_data/youtube.json'
      - 'templates/youtube/description_*.txt'
      - 'scripts/generate_descriptions.py'
      - 'scripts/update_youtube_videos.py'
      - 'tests/test_youtube_sync.py'
  # GitHubの画面から手動実行もできるようにする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install description-generation dependencies
        run: pip install pyyaml

      - name: Validate canonical catalog and YouTube data
        run: npm run validate:catalog

      - name: 1. Generate description texts
        run: python scripts/generate_descriptions.py

      - name: Validate canonical video inventory
        run: python scripts/update_youtube_videos.py --validate-only

      - name: Test YouTube sync contract
        run: python -m unittest tests/test_youtube_sync.py

      - name: Check whether YouTube credentials are available
        if: ${{ github.event_name != 'pull_request' }}
        id: youtube_credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [[ -n "$YOUTUBE_TOKEN_JSON" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2. Update YouTube Videos via API
        if: ${{ github.event_name != 'pull_request' && steps.youtube_credentials.outputs.available == 'true' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          python scripts/update_youtube_videos.py

      - name: Skip YouTube API update when credentials are unavailable
        if: ${{ github.event_name != 'pull_request' && steps.youtube_credentials.outputs.available != 'true' }}
        run: echo "::notice::YOUTUBE_TOKEN_JSON is not configured; generated descriptions were validated without updating YouTube."

      - name: Keep pull request runs validation-only
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "::notice::Pull request runs never update external YouTube videos."
